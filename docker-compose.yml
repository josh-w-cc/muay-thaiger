services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "npm install && npm run migrate && npm run migrate:seed && node --watch-path=. app.js"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tiger}
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 15s
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      timeout: 10s
    ports:
      - "3778:3000"
    restart: unless-stopped
    volumes:
      - ./api:/app
      - ./shared:/shared
      - /app/node_modules

  playwright:
    build: ./playwright
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:5173
    profiles:
      - playwright
    volumes:
      - ./playwright:/app
      - /app/node_modules

  postgres:
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 5s
    image: postgres:18
    ports:
      - "5777:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["sh", "-c", "npm ci && npm run dev -- --host"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: http://api:3000
    healthcheck:
      interval: 5s
      retries: 24
      start_period: 30s
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      timeout: 10s
    ports:
      - "3777:5173"
    restart: unless-stopped
    volumes:
      - ./shared:/shared
      - ./web:/app
      - /app/node_modules

volumes:
  postgres-data:
